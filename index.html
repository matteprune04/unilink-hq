<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172554">
<link rel="icon" href="logo-white.png">
<link rel="apple-touch-icon" href="logo-white.png">
<title>UniLink HQ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Croogla"; src: url("Croogla4F.ttf") format("truetype"); font-display: swap; }

/* Layout: sidebar navy fissa a sinistra (come il sito) + area di lavoro crema; su telefono la sidebar diventa un cassetto */
:root {
  color-scheme: light; /* look unico del brand UniLink, chiaro come unilinkfirenze.it */
  --navy: #172554; --navy-2: #22346f; --navy-soft: #e3e7f2;
  --cream: #f4f1ea; --beige: #e9e5dd; --line: #d9d4c9;
  --orange: #cf7527; --orange-dark: #914809; --orange-soft: #f6e6d6;
  --green: #1a453c; --green-soft: #dcebe6;
  --red: #a4321f; --red-soft: #f6e0db;
  --yellow-soft: #fbefc8; --yellow-dark: #7a5a00;
  --ink: #181d27; --muted: #6d6a63; --white: #ffffff;
  --fd: "Croogla", "Instrument Sans", sans-serif;
  --fb: "Instrument Sans", sans-serif;
  --r: 14px; --r-sm: 9px; --pill: 100px;
  --shadow: 0 1px 2px rgba(23,37,84,.06), 0 8px 24px rgba(23,37,84,.07);
  --side: 258px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--cream); color: var(--ink); font-family: var(--fb); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--fd); font-weight: 400; color: var(--navy); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.05; }
h2 { font-size: 22px; line-height: 1.15; }
h3 { font-size: 17px; line-height: 1.2; }
p { margin: 0; }
a { color: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- sidebar ---------- */
#side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--navy); color: #fff; display: flex; flex-direction: column; padding: calc(22px + env(safe-area-inset-top, 0px)) 14px calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; z-index: 40; transition: transform .25s ease; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
.brand img { height: 30px; width: auto; }
.brand span { font-family: var(--fd); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); border: 1px solid rgba(207,117,39,.55); border-radius: var(--pill); padding: 2px 9px 1px; }
.navg { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.5); padding: 16px 12px 6px; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; background: none; border: 0; color: rgba(255,255,255,.86); text-align: left; padding: 8px 12px; border-radius: var(--r-sm); cursor: pointer; font-size: 14.5px; }
.nav:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav.on { background: var(--orange); color: #fff; }
.nav .cnt { font-size: 12px; min-width: 22px; text-align: center; padding: 0 7px; border-radius: var(--pill); background: rgba(255,255,255,.12); }
.nav .cnt.alert { background: var(--red); color: #fff; }
.side-foot { margin-top: auto; padding: 18px 12px 0; font-size: 12.5px; color: rgba(255,255,255,.55); line-height: 1.45; }
.side-foot a { color: rgba(255,255,255,.8); }

.mtop { display: none; }
#scrim { display: none; }

/* ---------- main ---------- */
#main { margin-left: var(--side); min-height: 100%; padding-inline: clamp(16px, 3.5vw, 44px); padding-block: 30px 70px; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ph > div:first-child { min-width: 0; max-width: 680px; display: flex; flex-direction: column; gap: 8px; }
.ph p { color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--orange-dark); font-weight: 600; }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--white); color: var(--navy); padding: 8px 15px; border-radius: var(--pill); cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--navy); }
.btn.pri { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.pri:hover { background: var(--navy-2); }
.btn.acc { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.sm { padding: 4px 11px; font-size: 13px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--beige); }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
.btn[disabled] { opacity: .5; cursor: default; }

.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.click { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card.click:hover { border-color: var(--navy); box-shadow: var(--shadow); }
.panel { display: flex; flex-direction: column; gap: 12px; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel-h a, .linkbtn { font-size: 13px; color: var(--orange-dark); background: none; border: 0; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: var(--pill); background: var(--beige); color: var(--ink); white-space: nowrap; }
.chip.navy { background: var(--navy-soft); color: var(--navy); }
.chip.or { background: var(--orange-soft); color: var(--orange-dark); }
.chip.gr { background: var(--green-soft); color: var(--green); }
.chip.rd { background: var(--red-soft); color: var(--red); }
.chip.yl { background: var(--yellow-soft); color: var(--yellow-dark); }

/* filtri */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fchip { border: 1px solid var(--line); background: transparent; border-radius: var(--pill); padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--ink); }
.fchip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.search { border: 1px solid var(--line); background: var(--white); border-radius: var(--pill); padding: 6px 14px; min-width: 0; width: 220px; max-width: 100%; }

/* ---------- cruscotto ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lab { font-size: 13px; color: var(--muted); }
.kpi .val { font-family: var(--fd); font-size: 32px; color: var(--navy); line-height: 1.1; }
.kpi .val small { font-family: var(--fb); font-size: 13px; color: var(--muted); margin-left: 4px; }
.kpi.north { background: var(--navy); border-color: var(--navy); color: #fff; }
.kpi.north .lab, .kpi.north .val small { color: rgba(255,255,255,.7); }
.kpi.north .val { color: #fff; }
.kpi.north .eyebrow { color: var(--orange); }
.delta { font-size: 12.5px; font-weight: 600; }
.delta.up { color: var(--green); } .delta.down { color: var(--red); } .delta.flat { color: var(--muted); }
.kpi.north .delta.up { color: #8fd1b9; } .kpi.north .delta.down { color: #f2a493; }
.spark { display: block; max-width: 100%; }

.li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--beige); min-width: 0; }
.li:first-child { border-top: 0; padding-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 500; overflow-wrap: anywhere; }
.when { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.when.late { color: var(--red); font-weight: 600; }
.when.soon { color: var(--orange-dark); font-weight: 600; }

.bar { height: 7px; background: var(--beige); border-radius: var(--pill); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--orange); border-radius: var(--pill); }
.bar.gr > i { background: var(--green); }

.starter { background: var(--orange-soft); border-color: #ecc9a6; }
.starter ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.starter li.done { color: var(--muted); text-decoration: line-through; }

/* ---------- bacheca (kanban) ---------- */
.board-wrap { overflow-x: auto; padding-bottom: 6px; margin-inline: -4px; padding-inline: 4px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; min-width: min-content; }
.col { background: var(--beige); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; font-weight: 600; font-size: 13.5px; color: var(--navy); }
.col .card { padding: 13px; display: flex; flex-direction: column; gap: 8px; }
.thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--r-sm); background: var(--beige); display: block; }
.excerpt { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.vote { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--white); border-radius: var(--pill); padding: 2px 10px; font-size: 13px; cursor: pointer; color: var(--navy); }
.vote.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.vote svg { width: 13px; height: 13px; }
.mini-sel { border: 1px solid var(--line); border-radius: var(--pill); background: var(--white); font-size: 12.5px; padding: 2px 8px; max-width: 100%; }

/* task */
.task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-sm); }
.task + .task { margin-top: -1px; }
.task .grow { flex: 1; min-width: 0; cursor: pointer; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.chk { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--navy); background: var(--white); cursor: pointer; flex: none; margin-top: 2px; display: grid; place-items: center; padding: 0; }
.chk.on { background: var(--green); border-color: var(--green); }
.chk svg { width: 12px; height: 12px; }
.group-h { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 8px; }
.group-h h3 { font-size: 16px; }

/* metriche */
.mcard { display: flex; flex-direction: column; gap: 8px; }
.mcard .val { font-family: var(--fd); font-size: 30px; color: var(--navy); line-height: 1; }
.mcard.north { border: 2px solid var(--orange); }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; min-width: 520px; height: auto; }

/* tabelle */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--white); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--beige); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; background: var(--cream); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.in { color: var(--green); font-weight: 600; } .out { color: var(--red); font-weight: 600; }

blockquote { margin: 0; font-size: 15.5px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
blockquote::before { content: "“"; font-family: var(--fd); color: var(--orange); font-size: 30px; line-height: 0; vertical-align: -10px; margin-right: 3px; }

.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.who { font-weight: 500; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 26px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { color: var(--navy); }
.empty p { max-width: 520px; }
.banner { border-radius: var(--r); padding: 12px 16px; background: var(--navy-soft); color: var(--navy); font-size: 14px; }
.banner.warn { background: var(--yellow-soft); color: var(--yellow-dark); }

/* ---------- modale ---------- */
.modal { position: fixed; inset: 0; background: rgba(23,37,84,.45); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: calc(4vh + env(safe-area-inset-top, 0px)) 16px calc(4vh + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.sheet { background: var(--cream); border-radius: 20px; width: 100%; max-width: 760px; padding: 26px; box-shadow: 0 24px 70px rgba(23,37,84,.3); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sheet-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.x { border: 0; background: var(--beige); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--navy); flex: none; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld > span { font-size: 13px; font-weight: 600; color: var(--navy); }
.fld small { color: var(--muted); font-size: 12.5px; }
.fld input:not([type=checkbox]):not([type=file]), .fld select, .fld textarea, .inp { width: 100%; border: 1px solid var(--line); background: var(--white); border-radius: var(--r-sm); padding: 9px 11px; }
.fld textarea { resize: vertical; line-height: 1.45; }
.fld.chk-f { flex-direction: row; align-items: center; gap: 8px; }
.fld.chk-f input { width: 18px; height: 18px; accent-color: var(--navy); }
.form-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.imgs { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.imgs .im { position: relative; width: 108px; height: 80px; }
.imgs .im img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--line); }
.imgs .im button { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
.addimg { width: 108px; height: 80px; border: 1.5px dashed var(--line); border-radius: var(--r-sm); display: grid; place-items: center; text-align: center; font-size: 12.5px; color: var(--muted); cursor: pointer; background: var(--white); padding: 4px; }
.addimg input { display: none; }
.kr-row { display: grid; grid-template-columns: minmax(0, 1fr) 80px 80px 80px 30px; gap: 6px; align-items: center; }
.kr-row.h { font-size: 12px; color: var(--muted); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.gallery img { width: 100%; border-radius: var(--r-sm); border: 1px solid var(--line); cursor: zoom-in; display: block; background: var(--beige); min-height: 60px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px 16px; font-size: 14px; }
.meta div span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.comment { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; }
.big-img { width: 100%; border-radius: var(--r-sm); }

#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: var(--pill); font-size: 14px; z-index: 90; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (max-width: 880px) {
  #side { transform: translateX(-100%); box-shadow: 0 0 40px rgba(0,0,0,.3); }
  body.nav-open #side { transform: none; }
  body.nav-open #scrim { display: block; position: fixed; inset: 0; background: rgba(23,37,84,.4); z-index: 30; }
  #main { margin-left: 0; padding-block: 18px 60px; }
  .mtop { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; justify-content: space-between; gap: 10px; background: var(--navy); color: #fff; padding: 10px 16px; }
  .mtop img { height: 24px; }
  .mtop button { background: none; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: var(--pill); padding: 5px 13px; cursor: pointer; }
  .form { grid-template-columns: minmax(0, 1fr); }
  .sheet { padding: 20px 16px; }
  .kr-row { grid-template-columns: minmax(0, 1fr) 62px 62px 30px; }
  .kr-row .u { display: none; }
}

#login { position: fixed; inset: 0; z-index: 100; background: var(--navy); display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
.login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; color: #fff; }
.login-card h1 { color: #fff; font-size: 40px; }
.login-card .eyebrow { color: var(--orange); }
.login-card .fld > span { color: #fff; }
.login-card .fld small { color: rgba(255,255,255,.65); }
.login-card input { border: 1px solid rgba(255,255,255,.25); background: #fff; color: var(--ink); border-radius: var(--r-sm); padding: 11px 12px; width: 100%; }
.login-logo { height: 38px; width: auto; align-self: flex-start; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div id="login" hidden></div>
<div class="mtop"><img src="logo-white.png" alt="UniLink"><button type="button" data-menu>Menu</button></div>
<aside id="side" aria-label="Sezioni"></aside>
<div id="scrim" data-menu></div>
<main id="main"><div class="wrap"><div class="empty" style="margin-top:20vh">Caricamento dello spazio di lavoro…</div></div></main>
<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ================= costanti ================= */
const LOGO = "logo-white.png";
const AREE = ["Dispense e quiz", "Tools", "Mentor", "Community", "Social e marketing", "Partnership e B2B", "Prodotto e tech", "Monetizzazione", "Organizzazione"];
const IDEA_ST = ["Nuova", "Da valutare", "Approvata", "In sviluppo", "Fatta", "Archiviata"];
const TASK_ST = ["Da fare", "In corso", "Bloccato", "Fatto"];
const PIPE = ["Da contattare", "Contattato", "In trattativa", "Accordo attivo", "Non interessato"];
const PTYPES = ["Associazione studentesca", "Azienda", "Business school / Master", "Docente / Ateneo", "Sponsor", "Media / Creator", "Altro"];
const MGROUPS = ["Crescita", "Utilizzo", "Community", "Qualità", "Economia"];
const FCAT = ["Vendite / abbonamenti", "Sponsor e partner", "Software e abbonamenti", "Dominio e hosting", "Marketing e pubblicità", "Eventi", "Stampa e materiali", "Commercialista e burocrazia", "Altro"];
const MTYPES = ["Settimanale founder", "Strategia", "Con partner", "Con studenti / mentor", "Altro"];
const LCAT = ["Meeting fissi", "Documenti e Drive", "Social", "Design e brand", "Strumenti", "Università", "Altro"];
const AGENDA = "1. Metriche della settimana (5 min)\n2. Avanzamento obiettivi e scadenze\n3. Blocchi: dove serve aiuto\n4. Idee da decidere\n5. Prossimi passi: chi fa cosa entro quando";

function quarters() { const d = new Date(), out = []; let y = d.getFullYear(), q = Math.floor(d.getMonth() / 3) + 1; q -= 1; if (q < 1) { q = 4; y--; } for (let i = 0; i < 6; i++) { out.push(`T${q} ${y}`); q++; if (q > 4) { q = 1; y++; } } return out; }
const curQ = () => { const d = new Date(); return `T${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}`; };

const SCHEMA = {
  ideas: { one: "idea", fields: [
    { k: "title", l: "Titolo", req: 1, wide: 1, ph: "Es. Simulazioni d'esame cronometrate per Microeconomia" },
    { k: "body", l: "Descrizione", t: "textarea", rows: 5, wide: 1, ph: "Che problema risolve, per quali studenti, come funzionerebbe, cosa serve per provarla…" },

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => { u = String(u || "").trim(); if (!u) return ""; if (!/^https?:\/\//i.test(u)) u = "https://" + u; return u; };
const localISO = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const daysFrom = s => Math.round((new Date(String(s).slice(0, 10) + "T00:00") - new Date(localISO() + "T00:00")) / 864e5);
const rel = s => { const n = daysFrom(s); if (n === 0) return "oggi"; if (n === 1) return "domani"; if (n === -1) return "ieri"; return n > 0 ? `tra ${n} giorni` : `${-n} giorni fa`; };
const fmtD = (s, y) => { if (!s) return ""; const d = new Date(s.length > 10 ? s : s + "T00:00"); return d.toLocaleDateString("it-IT", { day: "numeric", month: "short", ...(y || d.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) }); };
const fmtDT = s => { if (!s) return ""; const d = new Date(s); return d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" }) + " · " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }); };
const nf = (n, dec = 0) => Number(n || 0).toLocaleString("it-IT", { maximumFractionDigits: dec });
const eur = n => Number(n || 0).toLocaleString("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const byDate = k => (a, b) => String(a[k] || "").localeCompare(String(b[k] || ""));

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2800); }
function chip(text, cls = "") { return text ? `<span class="chip ${cls}">${esc(text)}</span>` : ""; }
function stChip(s) { const m = { "Nuova": "navy", "Da valutare": "yl", "Approvata": "gr", "In sviluppo": "or", "Fatta": "gr", "Archiviata": "", "Da fare": "navy", "In corso": "or", "Bloccato": "rd", "Fatto": "gr", "Problema": "rd", "Richiesta": "or", "Apprezzamento": "gr", "Critica": "yl", "Presa": "gr", "Da rivedere": "yl", "Superata": "", "Alta": "rd", "Bassa": "" }; return chip(s, m[s] || ""); }
function whenCls(s) { const n = daysFrom(s); return n < 0 ? "late" : n <= 3 ? "soon" : ""; }
const author = (d) => d.by && !/^u_/.test(d.by) ? `<span class="who">${esc(d.by)}</span>` : "";

function spark(vals, w = 140, h = 36, dark) {
  if (vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v, i) => [2 + i * (w - 6) / (vals.length - 1), h - 4 - (v - mn) / r * (h - 9)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const l = pts[pts.length - 1];
  const fill = dark ? "rgba(207,117,39,.25)" : "var(--orange-soft)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d} L${l[0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z" fill="${fill}"/><path d="${d}" fill="none" stroke="var(--orange)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3" fill="var(--orange)"/></svg>`;
}

/* ================= dati ================= */
function series(mid) { return S.data.mvalues.filter(v => v.metricId === mid && v.date).sort(byDate("date")); }
function mStat(m) {
  const s = series(m.id), last = s[s.length - 1], prev = s[s.length - 2];
  const v = last ? Number(last.value) : null, p = prev ? Number(prev.value) : null;
  let delta = "";
  if (v != null && p != null) { const dd = v - p; const pct = p ? Math.round(dd / Math.abs(p) * 100) : null; delta = `<span class="delta ${dd > 0 ? "up" : dd < 0 ? "down" : "flat"}">${dd > 0 ? "+" : ""}${nf(dd, 1)}${pct != null && dd ? ` (${dd > 0 ? "+" : ""}${pct}%)` : ""} vs precedente</span>`; }
  const tgt = Number(m.target) || 0;
  return { s, last, v, delta, tgt, pctT: tgt && v != null ? Math.max(0, Math.min(100, v / tgt * 100)) : null };
}
function krPct(k) { const t = Number(k.target) || 0; return t ? Math.max(0, Math.min(100, (Number(k.current) || 0) / t * 100)) : 0; }
function okrPct(o) { const k = (o.krs || []).filter(x => x.label); return k.length ? Math.round(k.reduce((a, x) => a + krPct(x), 0) / k.length) : 0; }
function okrChip(p) { return p >= 100 ? chip("Raggiunto", "gr") : p >= 60 ? chip("In linea", "gr") : p >= 30 ? chip("In corso", "or") : chip("Da spingere", "rd"); }
const openTasks = () => S.data.tasks.filter(t => t.status !== "Fatto");
const lateTasks = () => openTasks().filter(t => t.due && daysFrom(t.due) < 0);
const votes = d => Object.values(d.votes || {}).filter(Boolean).length;
const voted = d => !!(S.uid && d.votes && d.votes[S.uid]);

function money() {
  const rows = S.data.finance;
  const sign = r => (r.type === "Entrata" ? 1 : -1) * (Number(r.amount) || 0);
  const saldo = rows.reduce((a, r) => a + sign(r), 0);
  const ym = localISO().slice(0, 7);
  const thisM = rows.filter(r => (r.date || "").startsWith(ym));
  const inM = thisM.filter(r => r.type === "Entrata").reduce((a, r) => a + (+r.amount || 0), 0);
  const outM = thisM.filter(r => r.type !== "Entrata").reduce((a, r) => a + (+r.amount || 0), 0);
  const fixed = rows.filter(r => r.recurring && r.type !== "Entrata").reduce((a, r) => a + (+r.amount || 0), 0);
  // burn medio sugli ultimi 3 mesi chiusi
  const months = []; const d = new Date(); for (let i = 1; i <= 3; i++) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push(localISO(x).slice(0, 7)); }
  const net = months.map(m => rows.filter(r => (r.date || "").startsWith(m)).reduce((a, r) => a + sign(r), 0));
  const burn = -net.reduce((a, b) => a + b, 0) / 3;
  const runway = burn > 0 && saldo > 0 ? saldo / burn : null;
  return { saldo, inM, outM, fixed, burn, runway };
}

const gdoc = () => S.data.google.find(x => x.id === "latest");
const CH_IT = { "Organic Search": "Ricerca Google", "Direct": "Diretto", "Organic Social": "Social", "Referral": "Altri siti", "Unassigned": "Non assegnato", "Email": "Email", "Paid Search": "Annunci", "Organic Video": "Video", "Cross-network": "Cross-network", "AI Assistant": "Assistenti AI (ChatGPT e simili)" };
const IDX_IT = { "URL is unknown to Google": "Google non conosce ancora la pagina", "Discovered - currently not indexed": "Trovata, non ancora indicizzata", "Crawled - currently not indexed": "Scansionata ma non indicizzata", "Duplicate without user-selected canonical": "Considerata un duplicato", "Duplicate, Google chose different canonical than user": "Google preferisce un'altra pagina simile", "Page with redirect": "Reindirizza a un'altra pagina", "Excluded by ‘noindex’ tag": "Esclusa con noindex", "Not found (404)": "Pagina non trovata (404)", "Soft 404": "Sembra una pagina vuota (soft 404)", "Blocked by robots.txt": "Bloccata da robots.txt", "Errore ispezione": "Controllo non riuscito" };
const DEV_IT = { mobile: "Telefono", desktop: "Computer", tablet: "Tablet" };
function dlt(cur, prev, invert) {
  if (prev == null || !isFinite(prev)) return "";
  const dd = cur - prev; if (!dd) return `<span class="delta flat">uguale al periodo prima</span>`;
  const pct = prev ? Math.round(dd / Math.abs(prev) * 100) : null; const good = invert ? dd < 0 : dd > 0;
  return `<span class="delta ${good ? "up" : "down"}">${dd > 0 ? "+" : ""}${nf(dd, 1)}${pct != null ? ` (${dd > 0 ? "+" : ""}${pct}%)` : ""} vs periodo prima</span>`;
}
function niceMax(v) { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function lineChart(pts, key, unit) {
  if (!pts || pts.length < 2) return `<p class="small muted">Servono almeno due giorni di dati.</p>`;
  const W = 720, H = 210, L = 44, R = 16, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
  const vals = pts.map(p => +p[key] || 0), mx = niceMax(Math.max(1, ...vals));
  const x = i => L + i * iw / (pts.length - 1), y = v => T + ih - v / mx * ih;
  const line = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const grid = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(mx * f).toFixed(1)}" y2="${y(mx * f).toFixed(1)}" stroke="var(--beige)"/><text x="${L - 8}" y="${(y(mx * f) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">${nf(mx * f)}</text>`).join("");
  const xl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map((i, k) => `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${["start", "middle", "end"][k]}" font-size="12" fill="var(--muted)">${fmtD(pts[i].d)}</text>`).join("");
  const li = vals.length - 1, hit = pts.map((p, i) => `<rect x="${(x(i) - iw / pts.length / 2).toFixed(1)}" y="${T}" width="${(iw / pts.length).toFixed(2)}" height="${ih}" fill="transparent"><title>${fmtD(p.d, 1)}: ${nf(vals[i])} ${unit}</title></rect>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento giornaliero">${grid}<path d="${line} L${x(li).toFixed(1)} ${T + ih} L${L} ${T + ih} Z" fill="var(--orange-soft)"/><path d="${line}" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(li).toFixed(1)}" cy="${y(vals[li]).toFixed(1)}" r="4" fill="var(--orange)"/>${xl}${hit}</svg></div>`;
}
function hbars(rows, label, val) {
  const mx = Math.max(1, ...rows.map(val));
  return `<div class="stack" style="gap:8px">${rows.map(r => `<div class="stack" style="gap:3px"><div class="row between small"><span style="min-width:0;overflow-wrap:anywhere">${esc(label(r))}</span><span class="num">${nf(val(r))}</span></div><div class="bar"><i style="width:${val(r) / mx * 100}%"></i></div></div>`).join("")}</div>`;
}
function homeWeb() {
  const g = gdoc(); if (!g) return "";
  const a = g.ga.last7, p = g.ga.prev7, s = g.gsc.last28, ix = g.index;
  return `<section class="card panel"><div class="panel-h"><h2>Sito web</h2><button class="linkbtn" data-nav="web">Dettagli</button></div>

    ${spark(g.ga.daily.slice(-28).map(x => x.users), 320, 40)}<span class="small muted">Aggiornato ${rel(g.updatedAt.slice(0, 10))} da Google Analytics e Search Console</span></section>`;

V.web = () => {
  const g = gdoc();
  const sub = "Il traffico del sito e come ci trovano su Google. I dati arrivano ogni giorno da Google Analytics e Search Console, in sola lettura: nessuno deve inserirli a mano.";
  if (!g) return `<div class="wrap">${head("Crescita", "Sito e Google", sub)}${emptyBox("I dati non sono ancora arrivati", "Compariranno qui al primo aggiornamento automatico.")}</div>`;

/* ================= render ================= */
let raf = 0;
function render() { cancelAnimationFrame(raf); raf = requestAnimationFrame(doRender); }
function doRender() {
  renderSide();
  const main = $("#main");
  const act = document.activeElement; const actId = act && act.id && main.contains(act) ? act.id : null; const sel = actId && act.selectionStart;
  let html;
  if (S.offline) html = `<div class="wrap">${head("UniLink HQ", "Accedi per vedere lo spazio di lavoro", "")}<div class="banner">Questa pagina salva idee, obiettivi e numeri in un archivio condiviso, visibile solo a chi ha effettuato l'accesso a claude.ai. Accedi con il tuo account e ricarica la pagina.</div></div>`;
  else if (!S.ready) html = `<div class="wrap"><div class="empty" style="margin-top:20vh">Caricamento dello spazio di lavoro…</div></div>`;
  else html = (S.canWrite ? "" : `<div class="wrap" style="margin-bottom:16px"><div class="banner">Stai guardando in sola lettura. Per aggiungere e modificare chiedi al proprietario della pagina di invitarti come Contributor o Editor.</div></div>`) + (V[S.view] || V.home)();
  main.innerHTML = html;
  if (actId) { const el = document.getElementById(actId); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) {} } }
  hydrate(main);
}
function hydrate(root) { loadImgs(root); }
function getImg(id) {
  if (!S.imgCache[id]) S.imgCache[id] = S.db.doc("images/" + id).get().then(s => s.exists ? s.data().data : "").catch(() => { delete S.imgCache[id]; return ""; });
  return S.imgCache[id];
}
function loadImgs(root) { if (!S.db) return; $$("img[data-img]", root).forEach(async im => { const id = im.dataset.img; if (!/^[\w.~:@+-]+$/.test(id)) return; const src = await getImg(id); if (src) im.src = src; }); }

/* ================= modale ================= */
function openModal(html) { const m = $("#modal"); $(".sheet", m).innerHTML = html; m.hidden = false; document.body.style.overflow = "hidden"; hydrate(m); }
function closeModal() { $("#modal").hidden = true; document.body.style.overflow = ""; S.form = null; }
const sheetHead = (eb, title) => `<div class="sheet-h"><div class="stack" style="gap:4px;min-width:0">${eb ? `<div class="eyebrow">${eb}</div>` : ""}<h2>${title}</h2></div><button class="x" data-close aria-label="Chiudi">×</button></div>`;

function fieldHTML(f, v) {
  const id = "f_" + f.k; let inp = "";
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : "";
  switch (f.t) {
    case "textarea": inp = `<textarea id="${id}" rows="${f.rows || 4}"${ph}>${esc(v ?? "")}</textarea>`; break;
    case "select": inp = `<select id="${id}">${(f.o.includes(v) || !v ? f.o : [v, ...f.o]).map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`; break;
    case "scale": inp = `<select id="${id}">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${String(n) === String(v ?? "3") ? "selected" : ""}>${n} · ${["molto basso", "basso", "medio", "alto", "molto alto"][n - 1]}</option>`).join("")}</select>`; break;
    case "date": inp = `<input id="${id}" type="date" value="${esc(v || "")}">`; break;
    case "datetime": inp = `<input id="${id}" type="datetime-local" value="${esc(v || "")}">`; break;
    case "number": inp = `<input id="${id}" type="number" step="any" inputmode="decimal" value="${esc(v ?? "")}"${ph}>`; break;
    case "url": inp = `<input id="${id}" type="url" value="${esc(v || "")}"${ph || ' placeholder="https://…"'}>`; break;
    case "person": inp = `<input id="${id}" list="dl_team" value="${esc(v || "")}" placeholder="${team().length ? "Scegli dal team" : "Nome"}" autocomplete="off"><datalist id="dl_team">${team().map(n => `<option value="${esc(n)}">`).join("")}</datalist>`; break;
    case "check": return `<label class="fld chk-f"><input id="${id}" type="checkbox" ${v ? "checked" : ""}><span>${f.l}</span></label>`;
    case "images": return `<div class="fld wide"><span>${f.l}</span><div class="imgs" id="imgs"></div><small>JPG o PNG, anche più di una. Puoi anche incollare uno screenshot con Ctrl+V. Le immagini vengono ridimensionate automaticamente.</small></div>`;
    case "krs": return `<div class="fld wide"><span>${f.l}</span><div class="stack" id="krs" style="gap:6px"></div>${f.help ? `<small>${f.help}</small>` : ""}</div>`;
    default: inp = `<input id="${id}" type="text" value="${esc(v || "")}"${ph}>`;
  }
  return `<label class="fld ${f.wide ? "wide" : ""}"><span>${f.l}${f.req ? " *" : ""}</span>${inp}${f.help ? `<small>${f.help}</small>` : ""}</label>`;
}
function defVal(f) { if (f.d === "@today") return localISO(); if (f.d === "@q") return curQ(); if (f.d != null) return f.d; if (f.t === "select") return f.o[0]; return ""; }

function openForm(col, id, preset) {
  if (!S.canWrite) return;
  const sc = SCHEMA[col]; const doc = id ? S.data[col].find(d => d.id === id) : null;
  const vals = Object.assign({}, ...sc.fields.map(f => ({ [f.k]: doc ? doc[f.k] : defVal(f) })), preset || {});
  S.form = { col, id, imgs: (vals.images || []).map(x => ({ id: x })), removed: [], krs: (vals.krs && vals.krs.length ? vals.krs : [{ label: "", current: 0, target: "", unit: "" }]).map(k => ({ ...k })) };
  openModal(`${sheetHead(doc ? "Modifica" : "Aggiungi", doc ? esc(doc.title || doc.name || doc.desc || sc.one) : "")}

async function compress(file) {
  const url = URL.createObjectURL(file); const img = new Image();
  try { await new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; img.src = url; }); } catch (e) { URL.revokeObjectURL(url); throw e; }
  let max = 1500, q = .82, out = "";
  for (let i = 0; i < 8; i++) {
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", q); if (out.length < 230000) break; max *= .8; q = Math.max(.5, q - .07);
  }
  URL.revokeObjectURL(url); return out;
}
async function addFiles(files) {
  for (const f of files) { if (!f.type.startsWith("image/")) continue; try { S.form.imgs.push({ data: await compress(f) }); } catch (e) { toast("Questa immagine non si apre: prova con un JPG o PNG."); } }
  drawImgs();
}

function readForm(sc) {
  const o = {};
  for (const f of sc.fields) {
    if (f.t === "images" || f.t === "krs") continue;
    const el = document.getElementById("f_" + f.k); if (!el) continue;
    if (f.t === "check") o[f.k] = el.checked;
    else if (f.t === "number") o[f.k] = el.value === "" ? "" : Number(el.value);
    else o[f.k] = el.value.trim();
    if (f.t === "url" && o[f.k]) o[f.k] = safeUrl(o[f.k]);
  }
  return o;
}

async function guard(fn) {
  try { return await fn(); }
  catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument" && /permission|level|denied|write/i.test(e.message || "")) { S.canWrite = false; render(); toast("Non hai i permessi per modificare questa pagina."); }
    else if (code === "invalid_argument") { toast("Non sono riuscito a salvare: " + (e.message || "dato non valido") + "."); if (!S.canWrite) render(); }
    else if (code === "quota_exceeded") toast("Spazio esaurito: elimina qualche immagine o elemento vecchio.");
    else if (code === "unavailable") toast("Connessione instabile: riprova tra un attimo.");
    else toast("Non sono riuscito a salvare. Riprova.");
    throw e;
  }
}

async function submitForm(e) {
  e.preventDefault(); const F = S.form; if (!F) return;
  const sc = SCHEMA[F.col]; const o = readForm(sc);
  const miss = sc.fields.find(f => f.req && (o[f.k] === "" || o[f.k] == null));
  if (miss) { toast(`Compila il campo “${miss.l}”.`); document.getElementById("f_" + miss.k)?.focus(); return; }
  const btn = $("#frm button[type=submit]"); btn.disabled = true; btn.textContent = "Salvo…";
  try {
    await guard(async () => {
      if (sc.fields.some(f => f.t === "images")) {
        const ids = [];
        for (const im of F.imgs) { if (im.id) ids.push(im.id); else { const r = S.db.collection("images").doc(); await r.set({ data: im.data, by: S.uid || "", at: new Date().toISOString() }); S.imgCache[r.id] = Promise.resolve(im.data); ids.push(r.id); } }
        o.images = ids;
      }
      if (sc.fields.some(f => f.t === "krs")) o.krs = F.krs.filter(k => (k.label || "").trim()).map(k => ({ label: k.label.trim(), current: Number(k.current) || 0, target: Number(k.target) || 0, unit: (k.unit || "").trim() }));
      if (F.col === "tasks" && o.status === "Fatto") o.doneAt = localISO();
      if (F.id) await S.db.collection(F.col).doc(F.id).update(o);
      else await S.db.collection(F.col).doc().set({ ...o, by: S.uid || "", createdAt: new Date().toISOString() });
      for (const rid of F.removed) await S.db.doc("images/" + rid).delete().catch(() => {});
    });
    const after = F.after; closeModal(); toast(F.id ? "Salvato" : "Aggiunto"); if (after) after();
  } catch (err) { btn.disabled = false; btn.textContent = "Riprova"; }
}

const wrapErr = e => ({ code: /JWT|auth|permission|policy|42501/i.test((e && (e.message || e.code)) || "") ? "invalid_argument" : "unavailable", message: (e && e.message) || "errore" });
const isPlain = v => v && typeof v === "object" && !Array.isArray(v);
function deepMerge(a, b) { const o = { ...(a || {}) }; for (const k in b) o[k] = isPlain(b[k]) && isPlain(o[k]) ? deepMerge(o[k], b[k]) : b[k]; return o; }
function snapOf(col) { return { docs: [...(LOCAL[col] || new Map()).entries()].map(([id, data]) => ({ id, exists: true, data: () => data })) }; }
function notify(col) { (LISTEN[col] || []).forEach(fn => { try { fn(snapOf(col)); } catch (e) { console.error(e); } }); }
function applyLocal(col, id, data) { const m = LOCAL[col] || (LOCAL[col] = new Map()); if (data == null) m.delete(id); else m.set(id, data); notify(col); }

async function loadAll() {
  const fresh = {}; let from = 0;
  for (;;) {
    const { data, error } = await SB.from("docs").select("col,id,data").range(from, from + 999);
    if (error) throw wrapErr(error);
    data.forEach(r => (fresh[r.col] || (fresh[r.col] = new Map())).set(r.id, r.data));
    if (data.length < 1000) break; from += 1000;
  }
  const cols = new Set([...Object.keys(LOCAL), ...Object.keys(fresh)]);
  cols.forEach(c => { LOCAL[c] = fresh[c] || new Map(); notify(c); });
}
const DB = {
  collection(col) {
    return {
      onSnapshot(next, err) {
        (LISTEN[col] || (LISTEN[col] = [])).push(next);
        (loadAllP || (loadAllP = loadAll())).then(() => next(snapOf(col))).catch(e => err && err(e));
        return () => {};
      },
      doc(id) { return DB.doc(col + "/" + (id || newId())); },
    };
  },
  doc(path) {
    const [col, id] = path.split("/");
    const isImg = col === "images";
    return {
      id,
      async get() {
        const q = isImg ? SB.from("images").select("data").eq("id", id) : SB.from("docs").select("data").eq("col", col).eq("id", id);
        const { data, error } = await q.maybeSingle(); if (error) throw wrapErr(error);
        const body = data ? (isImg ? { data: data.data } : data.data) : undefined;
        return { exists: !!data, data: () => body };
      },
      async set(d) {
        const { error } = isImg ? await SB.from("images").upsert({ id, data: d.data, by: d.by || "" })
          : await SB.from("docs").upsert({ col, id, data: d, updated_at: new Date().toISOString() });
        if (error) throw wrapErr(error);
        if (!isImg) applyLocal(col, id, d);
      },
      async update(p) {
        const cur = (LOCAL[col] && LOCAL[col].get(id)) || (await this.get()).data();
        if (!cur) throw { code: "invalid_argument", message: "l'elemento non esiste più" };
        await this.set(deepMerge(cur, p));
      },
      async delete() {
        const { error } = isImg ? await SB.from("images").delete().eq("id", id) : await SB.from("docs").delete().eq("col", col).eq("id", id);
        if (error) throw wrapErr(error);
        if (!isImg) applyLocal(col, id, null);
      },
    };
  },
};
function startRealtime() {
  SB.channel("hq-docs").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
    if (p.eventType === "DELETE") { if (p.old && p.old.col) applyLocal(p.old.col, p.old.id, null); }
    else if (p.new && p.new.col) applyLocal(p.new.col, p.new.id, p.new.data);
  }).subscribe();
  // al ritorno sulla scheda ricarica tutto: recupera eventuali modifiche perse mentre il telefono dormiva
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.ready) loadAll().catch(() => {}); });
}

/* ---------- schermata di accesso ---------- */
function showLogin(msg) {
  const box = document.getElementById("login");
  let name = ""; try { name = localStorage.getItem("ulhq_name") || ""; } catch (e) {}
  box.innerHTML = `<form class="login-card" id="loginForm" novalidate>
    <img src="logo-white.png" alt="UniLink" class="login-logo">
    <div class="stack" style="gap:6px"><span class="eyebrow">Area riservata ai founder</span><h1>UniLink HQ</h1></div>
    <label class="fld"><span>Il tuo nome</span><input id="lg_name" autocomplete="nickname" value="${esc(name)}" placeholder="Es. Matteo" list="lg_names"><datalist id="lg_names">${(HQ_CONFIG.founders || []).map(n => `<option value="${esc(n)}">`).join("")}</datalist><small>Serve solo a firmare idee, voti e commenti.</small></label>
    <label class="fld"><span>Password del team</span><input id="lg_pass" type="password" autocomplete="current-password"></label>
    ${msg ? `<div class="banner warn">${esc(msg)}</div>` : ""}
    <button class="btn acc" style="justify-content:center">Entra</button>
    <p class="small" style="opacity:.75">Una volta entrato, questo dispositivo resta collegato finché non premi “Esci”.</p></form>`;
  box.hidden = false;
  setTimeout(() => (name ? $("#lg_pass") : $("#lg_name")).focus(), 30);
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "loginForm") return;
  e.preventDefault(); e.stopImmediatePropagation();
  const name = $("#lg_name").value.trim(), pass = $("#lg_pass").value;
  if (!name) { showLogin("Scrivi il tuo nome."); return; }
  if (!pass) { showLogin("Scrivi la password."); return; }
  const btn = $("#loginForm button"); btn.disabled = true; btn.textContent = "Accesso…";
  const { error } = await SB.auth.signInWithPassword({ email: HQ_CONFIG.teamEmail, password: pass });
  if (error) { showLogin(/invalid/i.test(error.message) ? "Password sbagliata." : "Accesso non riuscito: controlla la connessione e riprova."); return; }
  try { localStorage.setItem("ulhq_name", name); } catch (er) {}
  $("#login").hidden = true; enter(name);
}, true);
async function logout() { await SB.auth.signOut(); location.reload(); }

/* ================= avvio ================= */
function enter(name) {
  S.uid = name; S.canWrite = true; S.db = DB;
  COLS.forEach(c => {
    S.db.collection(c).onSnapshot(snap => {
      S.data[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded.add(c); if (S.loaded.size === COLS.length) S.ready = true;
      if (S.ready) { render(); refreshOpen(c); }
    }, err => { if (err && err.code === "invalid_argument") { SB.auth.signOut(); showLogin("Sessione scaduta: rientra con la password."); } S.loaded.add(c); if (S.loaded.size === COLS.length) { S.ready = true; render(); } });
  });
  startRealtime();
}
async function boot() {
  let v = (location.hash || "").slice(1); if (!V[v]) { try { v = localStorage.getItem("ulhq_view") || "home"; } catch (e) { v = "home"; } }
  S.view = V[v] ? v : "home"; render();
  const { data } = await SB.auth.getSession();
  let name = ""; try { name = localStorage.getItem("ulhq_name") || ""; } catch (e) {}
  if (data && data.session && name) enter(name); else showLogin();
}

window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (V[v] && v !== S.view) go(v); });
boot();
</script>
